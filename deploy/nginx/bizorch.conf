# Install this as one Nginx server block after replacing server_name.
server {
    listen 80;
    server_name _;

    root /var/www/bizorch/current;
    index index.html;
    client_max_body_size 20m;

    # Keep ACME challenge files outside the versioned `current` release link.
    # Certificate tooling writes them under /var/www/bizorch/.well-known/.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bizorch;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
